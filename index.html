<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="format-detection" content="telephone=no">
  <title>公路求生 · 第一章</title>
  <style>
    :root {
      --bg: #0b0b0e;
      --bg2: #14141a;
      --paper: #1c1c24;
      --line: #2a2a33;
      --text: #efe8dc;
      --muted: #9a9388;
      --dim: #6e685e;
      --red: #d33b3b;
      --amber: #e2a225;
      --gold: #c9a227;
      --teal: #6ee0c6;
      --fuel: #ff934a;
      --food: #e0b043;
      --iron: #b9c3ce;
      --hp: #e35a5a;
      --dist: #7ec8e3;
      --mon: #c084fc;
      --safe: 0px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", "Source Han Sans SC", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }
    body {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% -10%, #2a1016 0%, transparent 46%),
        radial-gradient(ellipse at 50% 120%, #16101f 0%, transparent 50%),
        var(--bg);
    }
    #app {
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      background: linear-gradient(180deg, rgba(10,10,14,.4), rgba(10,10,14,.85));
      border-left: 1px solid #1c1c22;
      border-right: 1px solid #1c1c22;
    }
    #app::before {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: .04;
      background-image: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px);
      z-index: 8;
    }
    #hud {
      flex-shrink: 0;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 8px;
      background: linear-gradient(180deg, #0d0d12 0%, #121218 100%);
      border-bottom: 1px solid #2a2218;
      z-index: 5;
    }
    #hud.hidden { display: none; }
    .id-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    .id-line .who { color: var(--teal); }
    .id-line .day { color: var(--amber); }
    .id-line button {
      background: #1b1b22;
      color: var(--muted);
      border: 1px solid #33333c;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      font-family: inherit;
    }
    .pills {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    .pill {
      background: #1a1a21;
      border: 1px solid #2c2c34;
      border-radius: 8px;
      padding: 5px 4px 4px;
      text-align: center;
      font-size: 10px;
      color: var(--muted);
    }
    .pill b {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .pill[data-res="fuel"] b { color: var(--fuel); }
    .pill[data-res="food"] b { color: var(--food); }
    .pill[data-res="iron"] b { color: var(--iron); }
    .pill[data-res="hp"] b { color: var(--hp); }
    .pill.flash { animation: flashpill .5s ease; }
    @keyframes flashpill { 50% { background: #3a2a18; border-color: var(--amber); } }
    .metrics {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .metrics .d { color: var(--dist); }
    .metrics .m { color: var(--mon); }
    .track {
      position: relative;
      height: 14px;
      border-radius: 999px;
      background: #1a1a1f;
      border: 1px solid #2c2c34;
      overflow: hidden;
    }
    .track .lane {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 2px;
      background: repeating-linear-gradient(90deg, #c9a227 0 6px, transparent 6px 12px);
      transform: translateY(-50%);
      opacity: .7;
    }
    .track .ico {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      line-height: 1;
      transition: left .4s ease;
    }
    #stage {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .art {
      text-align: center;
      margin: 4px 0 14px;
      min-height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .art .emoji { font-size: 42px; line-height: 1; filter: drop-shadow(0 8px 16px rgba(0,0,0,.5)); }
    .art .caption { font-size: 12px; color: var(--dim); letter-spacing: .2em; }
    .eye-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; height: 72px; }
    .wing {
      width: 38px; height: 18px;
      background: radial-gradient(circle at 30% 50%, #5a2a2a, #1a0a0a);
      border-radius: 80% 20% 80% 20%;
      opacity: .85;
      animation: flap 2.4s ease-in-out infinite;
    }
    .wing.r { border-radius: 20% 80% 20% 80%; animation-delay: .1s; }
    @keyframes flap { 50% { transform: scaleY(.7) translateY(-2px); } }
    .eyeball {
      width: 58px; height: 58px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff6e8, #c9b8a0 46%, #3a2018 100%);
      box-shadow: 0 0 0 3px #2a1010, 0 0 24px rgba(210,40,40,.35);
      position: relative;
      animation: stare 4s ease-in-out infinite;
    }
    .iris {
      width: 26px; height: 26px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #6ee0c6, #0b4a40 70%);
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .pupil {
      width: 10px; height: 10px; border-radius: 50%; background: #0a0a0c;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    @keyframes stare { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .board {
      width: 100%;
      background: linear-gradient(180deg, #2a2418, #1a160e);
      border: 2px solid #6a5428;
      box-shadow: inset 0 0 0 1px #3a3018, 0 8px 24px rgba(0,0,0,.4);
      border-radius: 4px;
      padding: 12px 14px;
      text-align: left;
      color: #e8d5a3;
      font-size: 13px;
      line-height: 1.7;
    }
    .board h3 {
      text-align: center;
      color: #f0d48a;
      letter-spacing: .4em;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }
    .card {
      background: #19191f;
      border: 1px solid #33333c;
      border-radius: 8px;
      padding: 8px 8px 7px;
      text-align: left;
    }
    .card .nm { color: var(--amber); font-size: 13px; font-weight: 700; }
    .card .ds { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .sys, .memory, .narrative, .loot, .chatbox, .ending { position: relative; }
    .narrative {
      font-size: 16px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .narrative p + p { margin-top: .8em; }
    .sys {
      background: rgba(14, 36, 32, .7);
      border: 1px solid rgba(110, 224, 198, .3);
      color: var(--teal);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .sys::before {
      content: "系统";
      display: inline-block;
      font-size: 10px;
      letter-spacing: .2em;
      color: #0b0b0e;
      background: var(--teal);
      border-radius: 3px;
      padding: 0 5px;
      margin-right: 6px;
      vertical-align: 1px;
    }
    .memory {
      border-left: 3px solid var(--gold);
      padding: 4px 0 4px 10px;
      color: #d9c48a;
      font-size: 14px;
      font-style: italic;
      margin: 0 0 12px;
    }
    .loot {
      background: #19191f;
      border: 1px dashed #5a4a28;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      color: var(--food);
      font-size: 14px;
    }
    .loot strong { color: var(--amber); display: block; margin-bottom: 4px; }
    .chatbox {
      background: #12121a;
      border: 1px solid #2c2c38;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .chatbox .hd {
      background: #1a1a24;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      padding: 6px 10px;
      border-bottom: 1px solid #2c2c38;
    }
    .chatbox .msg { padding: 7px 10px; font-size: 13px; border-top: 1px solid #1c1c24; }
    .chatbox .msg:first-of-type { border-top: 0; }
    .chatbox .u { color: var(--amber); font-weight: 700; }
    .chatbox .u.me { color: var(--teal); }
    .chatbox .u.sysu { color: var(--red); }
    .banner {
      background: linear-gradient(90deg, transparent, rgba(180, 30, 30, .55), transparent);
      color: #fff2c8;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .06em;
      padding: 8px 10px;
      margin: 0 0 12px;
      animation: bannerin .6s ease;
    }
    @keyframes bannerin { from { opacity: 0; letter-spacing: .3em; } }
    .ending { text-align: center; }
    .ending h2 {
      font-size: 22px;
      letter-spacing: .2em;
      color: var(--amber);
      margin: 8px 0 12px;
    }
    .ending .rank {
      background: #16161c;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 8px 0;
      margin: 12px 0;
      text-align: left;
    }
    .ending .rank .row {
      display: flex;
      justify-content: space-between;
      padding: 5px 14px;
      font-size: 14px;
      color: var(--muted);
    }
    .ending .rank .row.me {
      background: rgba(110, 224, 198, .1);
      color: var(--teal);
      font-weight: 700;
    }
    .ending .stats { font-size: 13px; color: var(--muted); text-align: left; margin-top: 8px; }
    #choices {
      flex-shrink: 0;
      padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, transparent, #0c0c10 16px);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #choices button, .menu-btn {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: #1c1c24;
      border: 1px solid #3a3a44;
      border-radius: 10px;
      text-align: left;
      line-height: 1.4;
    }
    #choices button:active, .menu-btn:active { transform: scale(.99); background: #26262e; }
    #choices button.primary, .menu-btn.primary {
      background: linear-gradient(180deg, #6a2018, #4a120e);
      border-color: #8a3a28;
      color: #ffe8d0;
      text-align: center;
      letter-spacing: .12em;
      font-weight: 700;
    }
    #choices button.ghost {
      text-align: center;
      background: transparent;
      border-color: #2a2a30;
      color: var(--muted);
      min-height: 40px;
      font-size: 14px;
    }
    .hint { font-size: 11px; color: var(--dim); display: block; margin-top: 2px; }
    #dock {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding: 0 16px calc(8px + env(safe-area-inset-bottom, 0px));
    }
    #hud.hidden + #stage + #choices + #dock { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
    #btn-restart {
      background: none;
      border: none;
      color: var(--dim);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 12px 10px;
      letter-spacing: .16em;
    }
    #toast {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .toast-item {
      background: rgba(20,16,10,.92);
      border: 1px solid var(--gold);
      color: var(--amber);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      animation: pop .9s ease forwards;
    }
    .toast-item.neg { border-color: var(--red); color: var(--hp); }
    @keyframes pop {
      0% { opacity: 0; transform: translateY(8px); }
      20% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    #modal {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #modal.show { display: flex; }
    #modal .box {
      width: 100%;
      background: #16161c;
      border: 1px solid #3a3a44;
      border-radius: 12px;
      padding: 16px;
      max-height: 80dvh;
      overflow: auto;
    }
    #modal h3 { color: var(--amber); letter-spacing: .2em; font-size: 14px; margin-bottom: 10px; }
    #modal .row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; color: var(--muted); }
    #modal .row b { color: var(--text); font-weight: 600; }
    #modal .close {
      margin-top: 14px;
      width: 100%;
      min-height: 44px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: #1c1c24;
      border: 1px solid #3a3a44;
      border-radius: 10px;
    }
    .title-block { text-align: center; padding: 24px 8px 8px; }
    .title-block .series { font-size: 12px; color: var(--dim); letter-spacing: .28em; }
    .title-block h1 {
      font-size: 28px;
      letter-spacing: .28em;
      margin: 10px 0 6px;
      color: #f3e6c8;
      text-shadow: 0 0 24px rgba(200,40,40,.35);
    }
    .title-block .sub { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
    .title-block .ch {
      margin-top: 18px;
      display: inline-block;
      border: 1px solid #5a4020;
      color: var(--amber);
      font-size: 12px;
      letter-spacing: .3em;
      padding: 4px 12px;
    }
    .road-deco {
      width: 100%;
      height: 36px;
      margin: 18px 0 8px;
      background: #1a1a20;
      border-top: 3px solid #3a3a40;
      border-bottom: 3px solid #3a3a40;
      position: relative;
      overflow: hidden;
    }
    .road-deco i {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      transform: translateY(-50%);
      background: repeating-linear-gradient(90deg, #c9a227 0 18px, transparent 18px 36px);
      animation: roadmove 1.2s linear infinite;
    }
    @keyframes roadmove { to { background-position: 36px 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="hud" class="hidden">
      <div class="id-line">
        <span class="who">ID：独孤求败</span>
        <span class="day" id="day-label">第 1 天</span>
        <button type="button" id="btn-panel">面板</button>
      </div>
      <div class="pills">
        <div class="pill" data-res="fuel">⛽ 燃油<b id="v-fuel">0</b></div>
        <div class="pill" data-res="food">🍖 食物<b id="v-food">0</b></div>
        <div class="pill" data-res="iron">🔩 铁块<b id="v-iron">0</b></div>
        <div class="pill" data-res="hp">❤ 生命<b id="v-hp">100</b></div>
      </div>
      <div class="metrics">
        <span class="d">🛣 已行驶 <b id="v-dist">0</b> 公里</span>
        <span class="m">👁 怪物距离 <b id="v-gap">80</b> 公里</span>
      </div>
      <div class="track" aria-hidden="true">
        <div class="lane"></div>
        <span class="ico" id="ico-mon">👾</span>
        <span class="ico" id="ico-you">🛺</span>
      </div>
    </header>
    <main id="stage"></main>
    <div id="choices"></div>
    <div id="dock"><button type="button" id="btn-restart">重新开始</button></div>
    <div id="toast" aria-live="polite"></div>
    <div id="modal">
      <div class="box">
        <h3>生存者面板</h3>
        <div id="panel-body"></div>
        <button type="button" class="close" id="btn-close-panel">关闭</button>
      </div>
    </div>
  </div>
  <script>
(function () {
  "use strict";

  var STORAGE_KEY = "gonglu-ch1-v1";
  var TEST = /[?&]test=1\b/.test(location.search) || !!window.__GONGLU_TEST;

  var VEHICLES = {
    tri: { id: "tri", name: "广告三轮车", icon: "🛺", baseFuel: 30, kpf: 10, dayKm: 60, comfort: 5 },
    car: { id: "car", name: "轿车", icon: "🚗", baseFuel: 20, kpf: 6, dayKm: 70, comfort: 8 },
    rv:  { id: "rv",  name: "房车", icon: "🚐", baseFuel: 18, kpf: 4, dayKm: 55, comfort: 18 },
    suv: { id: "suv", name: "越野车", icon: "🚙", baseFuel: 20, kpf: 5, dayKm: 80, comfort: 8 }
  };

  function defaultState() {
    return {
      scene: "title",
      day: 1,
      fuel: 0,
      food: 0,
      iron: 0,
      hp: 100,
      distance: 0,
      monsterGap: 80,
      bonusFuel: 0,
      vehicle: null,
      vehicleLevel: 1,
      inventory: ["菜刀"],
      flags: {},
      entered: {},
      pack: null,
      dead: null
    };
  }

  var state = defaultState();
  var toastTimer = 0;

  var els = {
    hud: document.getElementById("hud"),
    stage: document.getElementById("stage"),
    choices: document.getElementById("choices"),
    day: document.getElementById("day-label"),
    fuel: document.getElementById("v-fuel"),
    food: document.getElementById("v-food"),
    iron: document.getElementById("v-iron"),
    hp: document.getElementById("v-hp"),
    dist: document.getElementById("v-dist"),
    gap: document.getElementById("v-gap"),
    icoYou: document.getElementById("ico-you"),
    icoMon: document.getElementById("ico-mon"),
    toast: document.getElementById("toast"),
    modal: document.getElementById("modal"),
    panel: document.getElementById("panel-body"),
    restart: document.getElementById("btn-restart"),
    btnPanel: document.getElementById("btn-panel"),
    btnClose: document.getElementById("btn-close-panel")
  };

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function veh() { return state.vehicle ? VEHICLES[state.vehicle] : null; }

  function kpf() {
    var v = veh();
    if (!v) return 10;
    var r = v.kpf;
    if (state.vehicleLevel >= 2) r = +(r * 1.4).toFixed(1);
    return r;
  }

  function dayKm() {
    var v = veh();
    if (!v) return 50;
    var d = v.dayKm;
    if (state.vehicleLevel >= 2) d += 20;
    return d;
  }

  function add(res, n) {
    if (!n) return;
    var prev = state[res];
    if (res === "hp") state.hp = clamp(state.hp + n, 0, 100);
    else state[res] = Math.max(0, (state[res] || 0) + n);
    toastRes(res, state[res] - prev);
    flashPill(res);
  }

  function toastRes(res, n) {
    if (!n) return;
    var names = { fuel: "燃油", food: "食物", iron: "铁块", hp: "生命", distance: "行驶公里", monsterGap: "怪物距离" };
    var label = names[res] || res;
    var sign = n > 0 ? "+" + n : String(n);
    showToast(label + " " + sign, n < 0);
  }

  function showToast(text, neg) {
    var item = document.createElement("div");
    item.className = "toast-item" + (neg ? " neg" : "");
    item.textContent = text;
    els.toast.appendChild(item);
    setTimeout(function () { if (item.parentNode) item.parentNode.removeChild(item); }, 1000);
  }

  function flashPill(res) {
    var el = document.querySelector('.pill[data-res="' + res + '"]');
    if (!el) return;
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }

  function drive(km) {
    var rate = kpf();
    var need = Math.max(1, Math.ceil(km / rate));
    var monsterMove = Math.round(km * 0.72) + 8;
    if (state.fuel < need) {
      var actual = Math.floor(state.fuel * rate);
      state.fuel = 0;
      state.distance += actual;
      state.monsterGap = Math.round((state.monsterGap + actual - monsterMove) * 10) / 10;
      return { actual: actual, stalled: true, spent: need, monsterMove: monsterMove };
    }
    state.fuel -= need;
    state.distance += km;
    state.monsterGap = Math.round((state.monsterGap + km - monsterMove) * 10) / 10;
    return { actual: km, stalled: false, spent: need, monsterMove: monsterMove };
  }

  function nightClose() {
    var close = state.fuel <= 0 ? 35 : 14;
    state.monsterGap -= close;
    return close;
  }

  function hasSave() {
    try { return !!localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function loadSave() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (!data || !data.scene) return false;
      state = Object.assign(defaultState(), data);
      state.flags = data.flags || {};
      state.inventory = data.inventory || ["菜刀"];
      return true;
    } catch (e) { return false; }
  }

  function clearSave() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function deathTarget() {
    if (state.dead) return "dead_" + state.dead;
    if (state.hp <= 0) { state.hp = 0; state.dead = "hp"; return "dead_hp"; }
    if (state.monsterGap <= 0) { state.monsterGap = 0; state.dead = "monster"; return "dead_monster"; }
    return null;
  }

  function goto(id, opts) {
    opts = opts || {};
    state.scene = id;
    var scene = resolve(id);
    if (!scene) {
      console.error("缺少场景", id);
      return;
    }
    if (!opts.load && typeof scene.onEnter === "function") {
      state.entered = state.entered || {};
      if (!state.entered[id]) {
        scene.onEnter();
        state.entered[id] = true;
      }
    }
    var deadTo = deathTarget();
    if (deadTo && id.indexOf("dead_") !== 0 && id !== "win") {
      goto(deadTo);
      return;
    }
    scene = resolve(id);
    render(scene);
    if (id !== "title") save();
  }

  function resolve(id) {
    var s = SCENES[id];
    if (typeof s === "function") s = s();
    return s;
  }

  function renderHud() {
    var show = !!(veh() && state.scene !== "title" && state.scene !== "intro" && state.scene !== "pack" && state.scene !== "eye" && state.scene !== "rules" && state.scene !== "faces" && state.scene !== "vehicle");
    els.hud.classList.toggle("hidden", !show);
    if (!show) return;
    els.day.textContent = "第 " + state.day + " 天" + (state.vehicleLevel >= 2 ? " · 载具2级" : "");
    els.fuel.textContent = state.fuel;
    els.food.textContent = state.food;
    els.iron.textContent = state.iron;
    els.hp.textContent = state.hp;
    els.dist.textContent = Math.round(state.distance);
    els.gap.textContent = Math.max(0, Math.round(state.monsterGap));
    var v = veh();
    els.icoYou.textContent = v ? v.icon : "🛺";
    var span = 220;
    var youPos = 82;
    var monPos = clamp(youPos - (state.monsterGap / span) * 70, 8, 76);
    els.icoYou.style.left = youPos + "%";
    els.icoMon.style.left = monPos + "%";
  }

  function render(scene) {
    renderHud();
    var html = "";
    if (scene.art) html += '<div class="art">' + scene.art + "</div>";
    if (scene.banner) html += '<div class="banner">' + scene.banner + "</div>";
    if (scene.system) html += '<div class="sys">' + scene.system + "</div>";
    if (scene.memory) html += '<div class="memory">' + scene.memory + "</div>";
    if (scene.text) html += '<div class="narrative">' + scene.text + "</div>";
    if (scene.loot) html += '<div class="loot">' + scene.loot + "</div>";
    if (scene.chat && scene.chat.length) {
      html += '<div class="chatbox"><div class="hd">世界频道 · E66 分区</div>';
      scene.chat.forEach(function (m) {
        var cls = m.who === "独孤求败" ? "me" : (m.who === "系统" ? "sysu" : "");
        html += '<div class="msg"><span class="u ' + cls + '">' + m.who + '：</span>' + m.text + "</div>";
      });
      html += "</div>";
    }
    if (scene.extra) html += scene.extra;
    els.stage.innerHTML = html;
    els.stage.scrollTop = 0;

    els.choices.innerHTML = "";
    (scene.choices || []).forEach(function (c, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.choice = String(i);
      if (c.primary) btn.className = "primary";
      if (c.ghost) btn.className = "ghost";
      btn.innerHTML = c.text + (c.hint ? '<span class="hint">' + c.hint + "</span>" : "");
      btn.addEventListener("click", function () { choose(i); });
      els.choices.appendChild(btn);
    });
  }

  function choose(i) {
    var scene = resolve(state.scene);
    if (!scene || !scene.choices || !scene.choices[i]) return;
    var c = scene.choices[i];
    if (typeof c.effect === "function") c.effect();
    var deadTo = deathTarget();
    if (deadTo && (!c.next || c.next.indexOf("dead_") !== 0) && c.next !== "win") {
      goto(deadTo);
      return;
    }
    if (c.next) goto(c.next);
    else render(resolve(state.scene));
  }

  function restart(force) {
    if (!force && !TEST) {
      if (!confirm("确定要重新开始吗？当前进度会被清空。")) return;
    }
    clearSave();
    state = defaultState();
    goto("title");
  }

  function startNew() {
    if (hasSave() && !TEST) {
      if (!confirm("会覆盖已有进度，确定重新开始？")) return;
    }
    clearSave();
    state = defaultState();
    goto("intro");
  }

  function continueGame() {
    if (!loadSave()) { goto("intro"); return; }
    goto(state.scene, { load: true });
  }

  function openPanel() {
    var v = veh();
    var flags = [];
    if (state.flags.announcedKill) flags.push("首杀已公告");
    if (state.flags.announcedUpgrade) flags.push("升级已公告");
    if (state.flags.bossTrade) flags.push("与矮胖老板交易");
    if (state.flags.bossGift) flags.push("施舍过燃油");
    if (state.flags.bossRefuse) flags.push("拒绝过讨油");
    if (state.flags.guardFight) flags.push("与保安冲突");
    var html = "";
    html += row("真名", "李峥（已暴露：" + (state.flags.announcedKill ? "是" : "否") + "）");
    html += row("游戏 ID", "独孤求败");
    html += row("分区", "E66 分区");
    html += row("载具", v ? (v.icon + " " + v.name + " · " + state.vehicleLevel + " 级") : "未选择");
    html += row("油耗", v ? ("每 " + kpf() + " 公里消耗 1 燃油") : "—");
    html += row("背包", state.inventory.join("、") || "空");
    html += row("记录", flags.length ? flags.join("、") : "无");
    els.panel.innerHTML = html;
    els.modal.classList.add("show");
  }

  function row(k, v) {
    return '<div class="row"><span>' + k + "</span><b>" + v + "</b></div>";
  }

  function setVehicle(id) {
    state.vehicle = id;
    var v = VEHICLES[id];
    state.fuel = v.baseFuel + (state.bonusFuel || 0);
    showToast("获得载具：" + v.name, false);
    showToast("燃油 +" + state.fuel, false);
  }

  function grantInv(item) {
    if (state.inventory.indexOf(item) === -1) state.inventory.push(item);
  }

  function calcRank() {
    var score = state.distance * 2 + state.fuel * 4 + state.food * 3 + state.iron * 3 + state.hp;
    if (state.flags.announcedKill) score += 80;
    if (state.vehicleLevel >= 2) score += 90;
    if (state.vehicle === "tri") score += 40;
    if (state.flags.announcedUpgrade) score += 30;
    if (state.flags.bossTrade) score += 15;
    var rank;
    if (score >= 620) rank = 1;
    else if (score >= 540) rank = 2;
    else if (score >= 470) rank = 3;
    else if (score >= 400) rank = 5;
    else if (score >= 330) rank = 8;
    else if (score >= 260) rank = 12;
    else rank = 21;
    return { score: Math.round(score), rank: rank };
  }

  function rankBoard(rank) {
    var names = ["要到尽头", "今夜不睡觉", "加油就跑", "路灯下的影子", "眼镜也挡不住慌", "贵宾犬先走", "还在找退出键"];
    var rows = [];
    if (rank <= 8) {
      for (var n = 1; n <= 8; n++) {
        if (n === rank) rows.push({ n: n, name: "独孤求败", me: true });
        else rows.push({ n: n, name: names[n > rank ? n - 2 : n - 1], me: false });
      }
    } else {
      for (var n = 1; n <= 7; n++) rows.push({ n: n, name: names[n - 1], me: false });
      rows.push({ n: rank, name: "独孤求败", me: true });
    }
    var html = '<div class="rank">';
    rows.forEach(function (r) {
      html += '<div class="row' + (r.me ? " me" : "") + '"><span>第 ' + r.n + " 名</span><span>" + r.name + (r.me ? "（你）" : "") + "</span></div>";
    });
    html += "</div>";
    return html;
  }

    },
    art: '<div class="emoji">✨</div><div class="caption">载具升级</div>',
    system: "载具升至 2 级。油耗下降，时速提升，电量/燃油得到部分补充。\n是否将此项成就进行全区公告？",
    text: '<p>升级很快。车身一阵发烫，随即稳下来。车斗更宽，坐着也不再那么硌。李峥试了试油门——同一段路，明显轻了。</p>',
    loot: "<strong>升级完成</strong>铁块 -6<br>燃油 +4<br>油耗改善，每日可行驶距离 +20 公里",
    choices: [
      { text: "全区公告", hint: "额外奖励，同时更加显眼", effect: function () { state.flags.announcedUpgrade = true; add("hp", 15); }, next: "upgrade_after" },
      { text: "暂不公告", effect: function () { state.flags.announcedUpgrade = false; }, next: "upgrade_after" }
    ]
  };

  SCENES.upgrade_after = function () {
    return {
      art: '<div class="emoji">' + (veh() ? veh().icon : "🔧") + '</div>',
      banner: state.flags.announcedUpgrade ? "全区播报：生存者独孤求败完成载具 2 级升级！" : "",
      text: state.flags.announcedUpgrade
        ? "<p>公告再一次砸进频道。系统额外给了一瓶红色药剂，伤口和疲劳跟着消退了一截。李峥把空瓶扔进车斗，继续往前开。</p>"
        : "<p>他没有公告。先把速度用在路上，比把名字再亮一次更重要。</p>",
      choices: [{ text: "第三天的路，继续向前", primary: true, next: "day3_road" }]
    };
  };

  SCENES.day3_road = function () {
    var run = state.flags._d3 || { actual: 0, stalled: false, spent: 0 };
    var body = run.stalled
      ? "<p>第三天，油还是没撑住。车停下来的时候，后方的影子已经能看清轮廓了——它不高，可嘴很大。</p>"
      : "<p>第三天向前开了 " + run.actual + " 公里，耗油 " + run.spent + "。怪物还在后面，但暂时没有贴上来。</p><p>就在这时，频道和路边同时有了动静。</p>";
    return {
      onEnter: function () {
        state.day = 3;
        state.flags._d3 = drive(dayKm());
      },
      art: run.stalled ? '<div class="emoji">⛽</div><div class="caption">燃油耗尽</div>' : '<div class="emoji">🛣</div><div class="caption">第三天的路</div>',
      text: body,
      choices: run.stalled
        ? [{ text: "只能下车想办法", primary: true, next: "stalled" }]
        : [{ text: "看看是什么情况", primary: true, next: "day3_event" }]
    };
  };

  SCENES.day3_event = function () {
    if (state.flags.bossTrade) {
      return {
        onEnter: function () { add("fuel", 4); add("iron", 2); },
        art: '<div class="emoji">📦</div><div class="caption">私聊</div>',
        chat: [
          { who: "矮胖老板", text: "独孤求败，前方护栏后还有一只小铁箱，我开不动了，坐标发给你。这笔买卖，我认了。" }
        ],
        text: "<p>李峥依言找过去，还真有一只被人慌乱丢下的小箱。燃油和铁块都在。他没有回谢。</p>",
        loot: "<strong>获得物资</strong>燃油 ×4<br>铁块 ×2",
        choices: [{ text: "收好，做最后一段路", primary: true, next: "finale" }]
      };
    }
    if (state.flags.bossGift) {
      return {
        onEnter: function () { add("fuel", 5); },
        art: '<div class="emoji">⛽</div><div class="caption">还人情</div>',
        chat: [
          { who: "矮胖老板", text: "昨天那份油救了我。我不是白眼狼——这是我匀得出来的全部。你先用。" }
        ],
        text: "<p>一份燃油隔空到账。李峥看着面板，没说「不用谢」，只回了一个字：收到。</p>",
        loot: "<strong>获得物资</strong>燃油 ×5",
        choices: [{ text: "继续向前", primary: true, next: "finale" }]
      };
    }
    if (state.flags.announcedKill) {
      return {
        art: '<div class="emoji">⚔️</div><div class="caption">有人拦路</div>',
        text: "<p>一辆破车斜着停在路中，两个人跳下来挥手，脸上是笑，手里是棍。「首杀大佬，匀点油，大家都是出来混的。」</p><p>李峥没有减速的意思。这一世，他不打算再给这种人开口的第二次机会。</p>",
        choices: [
          { text: "硬冲过去，菜刀招呼敢拦车的人", hint: "生命 -12，可能搜到一点油", effect: function () { add("hp", -12); add("fuel", 3); state.flags.robbery = "fight"; }, next: "finale" },
          { text: "绕开，多耗一点油甩掉他们", hint: "燃油 -3", effect: function () { add("fuel", -3); state.flags.robbery = "flee"; }, next: "finale" }
        ]
      };
    }
    return {
      art: '<div class="emoji">🛣</div>',
      text: "<p>频道里矮胖老板还在骂街，但没有再找上门。公路空旷，只有风和轮胎声。李峥把速度稳住，不贪这一时的冲刺。</p>",
      choices: [{ text: "做最后一段路", primary: true, next: "finale" }]
    };
  };

  SCENES.finale = function () {
    var ok = state.hp > 0 && state.monsterGap > 0;
    return {
      art: '<div class="emoji">🌄</div><div class="caption">天色将亮</div>',
      text: ok
        ? "<p>第三天的路跑完时，天边裂开一条灰白。李峥把车停在路肩，听了很久。后方的咀嚼声还在，可已经咬不到这辆车的尾灯。</p><p>公路仍旧没有尽头。他把菜刀擦净，重新放回手边。这只是开始。</p>"
        : "<p>他还想再往前开一段。可身体或油表，已经先一步给出了答案。</p>",
      choices: ok
        ? [{ text: "查看本日结算", primary: true, next: "win" }]
        : [{ text: "……", primary: true, next: deathTarget() || "dead_monster" }]
    };
  };

  SCENES.win = function () {
    var r = calcRank();
    state.flags.rank = r.rank;
    state.flags.score = r.score;
    var v = veh();
    return {
      art: '<div class="emoji">🏆</div><div class="caption">E66 分区 · 临时榜</div>',
      extra: '<div class="ending"><h2>第一章完 · 未完待续</h2><p style="color:#9a9388;font-size:14px;">你活过了开局三天。公路的尽头，还在很远的地方。</p>' +
        rankBoard(r.rank) +
        '<div class="stats">结算：行驶 ' + Math.round(state.distance) + " 公里　剩余燃油 " + state.fuel +
        "　食物 " + state.food + "　铁块 " + state.iron + "　生命 " + state.hp +
        "<br>载具：" + (v ? v.icon + " " + v.name + " " + state.vehicleLevel + " 级" : "无") +
        "<br>综合评分 " + r.score + "　当前名次：第 " + r.rank + " 名</div></div>",
      choices: [
        { text: "再玩一次", primary: true, effect: function () { restart(true); }, next: null },
        { text: "回到标题", ghost: true, effect: function () { save(); goto("title"); }, next: null }
      ]
    };
  };

  SCENES.stalled = function () {
    var help = state.flags.bossGift && state.fuel === 0;
    return {
      art: '<div class="emoji">☠️</div><div class="caption">车停了</div>',
      text: help
        ? "<p>车停在路中央。就在李峥准备放弃的时候，一份微弱的燃油到账——矮胖老板的消息紧跟着弹出来：「先用着，我说过我不是白眼狼。」</p>"
        : "<p>燃油耗尽。车停在路中央，像一块等着被吞掉的铁。后方的咀嚼声由远及近，沥青在发抖。李峥握着菜刀下车，他知道这没用。</p>",
      choices: help
        ? [{ text: "把这点油灌进去，再跑一截", effect: function () { add("fuel", 4); }, next: "finale" }]
        : [
            { text: "放弃载具，向前跑", hint: "生命会大减，怪物会迅速靠近", effect: function () { add("hp", -40); state.monsterGap -= 40; }, next: "finale" },
            { text: "留在车里等", hint: "几乎等于把后背交给它", effect: function () { state.monsterGap = 0; state.dead = "fuel"; }, next: "dead_fuel" }
          ]
    };
  };

  SCENES.dead_hp = {
    art: '<div class="emoji">💔</div><div class="caption">生命归零</div>',
    text: '<p>视野先从边缘黑掉。菜刀还在手里，可手指已经没有力气。李峥听见自己的呼吸断了一截。</p><p>对李峥来说，这不是第一次死亡。但这一世，本可以不同。</p>',
    system: "生存者李峥已死亡。背包将随死亡消失。",
    choices: [
      { text: "重新开始", primary: true, effect: function () { restart(true); }, next: null }
    ]
  };

  SCENES.dead_monster = {
    art: '<div class="emoji">👾</div><div class="caption">被追上</div>',
    text: '<p>后视镜里的影子忽然就到了保险杠后面。它不高，嘴却张得很大，热气和腥味一起灌进车窗。李峥踩下油门，可已经没有用了。</p><p>公路还在向前。车上不再有人。</p>',
    system: "生存者李峥已死亡。不要心存侥幸。",
    choices: [
      { text: "重新开始", primary: true, effect: function () { restart(true); }, next: null }
    ]
  };

  SCENES.dead_fuel = {
    art: '<div class="emoji">⛽</div><div class="caption">无油可逃</div>',
    text: '<p>油表归零的声音比想象中更轻。车停了，世界却没有停。咀嚼声先是远，再是近，最后贴上了铁皮。</p><p>前世为了买油死在路上的人，他见过很多。这一次，轮到他自己。</p>',
    system: "生存者李峥已死亡。燃油耗尽，被食肉怪物追上。",
    choices: [
      { text: "重新开始", primary: true, effect: function () { restart(true); }, next: null }
    ]
  };

  /* ---------- 绑定 ---------- */
  els.restart.addEventListener("click", function () { restart(false); });
  els.btnPanel.addEventListener("click", openPanel);
  els.btnClose.addEventListener("click", function () { els.modal.classList.remove("show"); });
  els.modal.addEventListener("click", function (e) { if (e.target === els.modal) els.modal.classList.remove("show"); });

  window.GongluGame = {
    getState: function () { return state; },
    getScene: function () { return state.scene; },
    goto: goto,
    choose: choose,
    restart: function () { restart(true); },
    start: startNew,
    load: continueGame,
    hasSave: hasSave,
    VEHICLES: VEHICLES
  };

  if (TEST) window.__GONGLU_TEST = true;
  goto("title");
})();
  </script>
</body>
</html>
