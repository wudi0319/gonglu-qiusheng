<script>
(function(){
'use strict';
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,ZOOM=1,VW=0,VH=0,SAFE_T=0,SAFE_B=0;
var M=8;               // 每米 8 个世界单位
var ROAD=150, FOG=930, WALL=1000, CH=800, TS=32;
var DEBUG=/[?&]debug/.test(location.search);
var FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei",sans-serif';
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var PI=Math.PI, TAU=PI*2;
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function wrap(a){while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;}
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rnd(a,b+1));}
function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);}

// 车辆等级数值
var LV=[null,
 {max:240,acc:210,turn:2.7,rate:0.040,armor:1.0,tank:100,ram:95, name:'贴满广告的三轮车'},
 {max:290,acc:255,turn:2.9,rate:0.032,armor:1.7,tank:125,ram:75, name:'铁皮加固三轮车'},
 {max:345,acc:305,turn:3.1,rate:0.025,armor:2.6,tank:150,ram:55, name:'装甲战车三轮'}];
var UPCOST=[0,6,14];

// ---------- 预渲染素材 ----------
var PAT={}, PATC={}, GLOW={}, FX=null;
function mkCanvas(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function buildAssets(){
  var r=mulberry(42);
  // 荒野沙土
  var s=mkCanvas(256,256), g=s.getContext('2d');
  g.fillStyle='#7d5a3c';g.fillRect(0,0,256,256);
  for(var i=0;i<2600;i++){var v=r();g.fillStyle=v<.5?'rgba(40,22,10,'+(r()*.18)+')':'rgba(230,170,110,'+(r()*.12)+')';g.fillRect(r()*256,r()*256,1+r()*2.5,1+r()*2.5);}
  for(i=0;i<40;i++){g.fillStyle='rgba(60,40,25,'+(.2+r()*.3)+')';g.beginPath();g.ellipse(r()*256,r()*256,1.5+r()*3,1+r()*2,r()*3,0,TAU);g.fill();}
  for(i=0;i<10;i++){g.strokeStyle='rgba(50,30,15,.25)';g.lineWidth=1;g.beginPath();var x=r()*256,y=r()*256;g.moveTo(x,y);for(var k=0;k<4;k++){x+=r()*30-15;y+=r()*30-15;g.lineTo(x,y);}g.stroke();}
  PAT.sand=ctx.createPattern(s,'repeat');PATC.sand=s;
  // 沥青
  var a=mkCanvas(256,256), h=a.getContext('2d');
  h.fillStyle='#3b3436';h.fillRect(0,0,256,256);
  for(i=0;i<5000;i++){var w=r();h.fillStyle=w<.5?'rgba(0,0,0,'+(r()*.25)+')':'rgba(255,220,200,'+(r()*.08)+')';h.fillRect(r()*256,r()*256,1+r()*1.5,1+r()*1.5);}
  for(i=0;i<6;i++){h.fillStyle='rgba(20,15,18,.18)';h.beginPath();h.ellipse(r()*256,r()*256,10+r()*30,6+r()*20,r()*3,0,TAU);h.fill();}
  PAT.asphalt=ctx.createPattern(a,'repeat');

  // 室内地砖
  var tl=mkCanvas(64,64),t2=tl.getContext('2d');t2.fillStyle='#8f8676';t2.fillRect(0,0,64,64);
  for(i=0;i<4;i++){var tx=(i%2)*32,ty=(i>>1)*32;t2.fillStyle=(i===0||i===3)?'#978d7c':'#887f70';t2.fillRect(tx+1,ty+1,30,30);}
  for(i=0;i<300;i++){t2.fillStyle='rgba(40,30,20,'+(r()*.15)+')';t2.fillRect(r()*64,r()*64,1+r()*2,1+r()*2);}
  t2.strokeStyle='rgba(50,40,30,.35)';t2.lineWidth=1;t2.strokeRect(.5,.5,63,63);t2.beginPath();t2.moveTo(32,0);t2.lineTo(32,64);t2.moveTo(0,32);t2.lineTo(64,32);t2.stroke();
  PAT.tile=ctx.createPattern(tl,'repeat');PATC.tile=tl;
  // 水泥地
  var cc=mkCanvas(128,128),c2=cc.getContext('2d');c2.fillStyle='#6d6762';c2.fillRect(0,0,128,128);
  for(i=0;i<1500;i++){c2.fillStyle=r()<.5?'rgba(0,0,0,'+(r()*.15)+')':'rgba(255,240,220,'+(r()*.08)+')';c2.fillRect(r()*128,r()*128,1+r()*2,1+r()*2);}
  c2.strokeStyle='rgba(30,25,25,.35)';c2.strokeRect(.5,.5,127,127);
  PAT.concrete=ctx.createPattern(cc,'repeat');PATC.concrete=cc;
  // 蛇巢黏液地
  var gc=mkCanvas(128,128),g2=gc.getContext('2d');g2.fillStyle='#2e2633';g2.fillRect(0,0,128,128);
  for(i=0;i<60;i++){g2.fillStyle='rgba('+(60+r()*40|0)+','+(90+r()*60|0)+',70,'+(.1+r()*.2)+')';g2.beginPath();g2.ellipse(r()*128,r()*128,3+r()*12,2+r()*8,r()*3,0,TAU);g2.fill();}
  for(i=0;i<800;i++){g2.fillStyle='rgba(0,0,0,'+(r()*.25)+')';g2.fillRect(r()*128,r()*128,1.5,1.5);}
  PAT.goo=ctx.createPattern(gc,'repeat');PATC.goo=gc;
  // 岩壁
  var rc=mkCanvas(64,64),r2=rc.getContext('2d');r2.fillStyle='#4a3e3a';r2.fillRect(0,0,64,64);
  for(i=0;i<20;i++){r2.fillStyle='rgba('+(90+r()*40|0)+','+(75+r()*30|0)+','+(65+r()*25|0)+',.6)';r2.beginPath();r2.ellipse(r()*64,r()*64,4+r()*10,3+r()*7,r()*3,0,TAU);r2.fill();}
  PAT.rock=ctx.createPattern(rc,'repeat');PATC.rock=rc;
  // 木地板
  var wc=mkCanvas(64,64),w2=wc.getContext('2d');w2.fillStyle='#6b4a30';w2.fillRect(0,0,64,64);
  for(i=0;i<8;i++){w2.fillStyle=i%2?'#734f33':'#65452c';w2.fillRect(0,i*8,64,7);w2.fillStyle='rgba(0,0,0,.3)';w2.fillRect(((i*23)%64),i*8,1,7);}
  PAT.wood=ctx.createPattern(wc,'repeat');PATC.wood=wc;
  // 发光
  function glow(name,col,sz){var c=mkCanvas(sz,sz),q=c.getContext('2d');var gr=q.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);gr.addColorStop(0,col.replace('A','1'));gr.addColorStop(.25,col.replace('A','.55'));gr.addColorStop(1,col.replace('A','0'));q.fillStyle=gr;q.fillRect(0,0,sz,sz);GLOW[name]=c;}

function invCount(id){var n=0;for(var i=0;i<G.inv.length;i++)if(G.inv[i].id===id)n+=G.inv[i].n;return n;}
function invAdd(id,n){var st=ITEMS[id].stack,i;
  for(i=0;i<G.inv.length&&n>0;i++){var s=G.inv[i];if(s.id===id&&s.n<st){var k=Math.min(st-s.n,n);s.n+=k;n-=k;}}
  while(n>0&&G.inv.length<G.cap){var k2=Math.min(st,n);G.inv.push({id:id,n:k2});n-=k2;}
  return n;}
function invRemove(id,n){var got=0;for(var i=G.inv.length-1;i>=0&&n>0;i--){var s=G.inv[i];if(s.id!==id)continue;var k=Math.min(s.n,n);s.n-=k;n-=k;got+=k;if(s.n<=0)G.inv.splice(i,1);}return got;}
function eat(id){var it=ITEMS[id],p=G.player;if(!it||(!it.food&&!it.hp)||invCount(id)<=0)return false;invRemove(id,1);

function solids(x,y,range,fn){
  var i,o;
  for(i=0;i<G.wrecks.length;i++){o=G.wrecks[i];if(Math.abs(o.y-y)<range+o.h/2&&Math.abs(o.x-x)<range+o.w/2)fn('box',o);}
  for(var key in G.chunks){var ch=G.chunks[key];if(ch.top>y+range||ch.bot<y-range)continue;
    for(i=0;i<ch.trees.length;i++){o=ch.trees[i];if(Math.abs(o.y-y)<range&&Math.abs(o.x-x)<range)fn('circ',{x:o.x,y:o.y,r:7*o.s});}
    for(i=0;i<ch.rocks.length;i++){o=ch.rocks[i];if(o.solid&&Math.abs(o.y-y)<range&&Math.abs(o.x-x)<range)fn('circ',{x:o.x,y:o.y,r:o.s*.85});}}
  var k0=Math.floor((y-range)/320),k1=Math.floor((y+range)/320);
  if(Math.abs(x-(-ROAD-62))<range)for(var k=k0;k<=k1;k++)if(k*320>G.gateY)fn('circ',{x:-ROAD-62,y:k*320,r:6});
  for(i=0;i<G.locs.length;i++){var L=G.locs[i];if(x<L.x0-range||x>L.x0+L.w+range||y<L.y0-range||y>L.y0+L.h+range)continue;
    var j0=Math.max(0,Math.floor((x-range-L.x0)/TS)),j1=Math.min(L.cols-1,Math.floor((x+range-L.x0)/TS)),i0=Math.max(0,Math.floor((y-range-L.y0)/TS)),i1=Math.min(L.rows-1,Math.floor((y+range-L.y0)/TS));
    for(var a=i0;a<=i1;a++)for(var b=j0;b<=j1;b++){if(SOLID.indexOf(L.grid[a][b])>=0)fn('box',{x:L.x0+(b+.5)*TS,y:L.y0+(a+.5)*TS,w:TS,h:TS});}}
  // 安全区围栏
  if(Math.abs(y-G.gateY)<range+12){fn('box',{x:-587.5,y:G.gateY,w:1025,h:20});fn('box',{x:587.5,y:G.gateY,w:1025,h:20});
    if(G.day===3&&!G.flags.bossDead)fn('box',{x:0,y:G.gateY,w:150,h:20});}
}
function collide(ent,rad,vel){
  var hit=0;
  solids(ent.x,ent.y,rad+90,function(kind,o){
    var nx,ny,d,pen;
    if(kind==='box'){var hx=o.w/2,hy=o.h/2,cx=clamp(ent.x,o.x-hx,o.x+hx),cy=clamp(ent.y,o.y-hy,o.y+hy);
      nx=ent.x-cx;ny=ent.y-cy;d=Math.sqrt(nx*nx+ny*ny);
      if(d===0){var dx=ent.x-o.x,dy=ent.y-o.y;if(Math.abs(dx)/hx>Math.abs(dy)/hy){nx=dx>0?1:-1;ny=0;pen=hx-Math.abs(dx)+rad;}else{nx=0;ny=dy>0?1:-1;pen=hy-Math.abs(dy)+rad;}}
      else{if(d>=rad)return;pen=rad-d;nx/=d;ny/=d;}}
    else{nx=ent.x-o.x;ny=ent.y-o.y;d=Math.sqrt(nx*nx+ny*ny)||0.001;if(d>=rad+o.r)return;pen=rad+o.r-d;nx/=d;ny/=d;}
    ent.x+=nx*pen;ent.y+=ny*pen;
    if(vel){var vn=vel.vx*nx+vel.vy*ny;if(vn<0){vel.vx-=nx*vn*1.35;vel.vy-=ny*vn*1.35;hit=Math.max(hit,-vn);}}
  });
  return hit;
}

}

// ---------- 更新 ----------
function update(dt){
  if(!G)return;
  var p=G.player,c=G.car;
  if(G.state==='dying'){G.dyingT+=dt;dt*=.3;if(G.dyingT>1.3){showDead();}}
  if(G.state!=='play'&&G.state!=='dying'){updateParts(dt);if(G.state==='title')G.t+=dt;return;}
  if(G.paused)return;
  G.t+=dt;
  var inp=G.state==='play'?getInput():{x:0,y:0,m:0};
  if(ATK_HELD)attack();
  p.atkCd=Math.max(0,p.atkCd-dt);if(p.swing>=0){p.swing+=dt/.22;if(p.swing>1)p.swing=-1;}
  p.hurtT=Math.max(0,p.hurtT-dt);G.flash=Math.max(0,G.flash-dt*1.6);
  // 搜索进度
  if(G.search){var sc=G.search.c;if(!(ACT_HELD||KEYS.KeyE)||inp.m>0.35||p.inCar||contDist(sc,p.x,p.y)>34)G.search=null;else{G.search.t+=dt;if(G.search.t>=G.search.dur)finishSearch(sc);}}
  // 步行
  if(!p.inCar){
    var sp=100;
    if(inp.m>0.1&&!G.search){p.x+=inp.x*sp*Math.min(1,inp.m*1.3)*dt;p.y+=inp.y*sp*Math.min(1,inp.m*1.3)*dt;p.face=Math.atan2(inp.x,-inp.y);p.walk+=dt*12*inp.m;p.moving=true;
      if(Math.random()<dt*5)part(p.x+rnd(-4,4),p.y+6,rnd(-10,10),rnd(-5,10),.5,3,'rgba(150,120,90,',1);}
    else p.moving=false;
    collide(p,9,null);
    var dcx=p.x-c.x,dcy=p.y-c.y,dd=Math.sqrt(dcx*dcx+dcy*dcy);if(dd<30&&dd>0&&!c.lost){p.x=c.x+dcx/dd*30;p.y=c.y+dcy/dd*30;}
  }
  updateCar(dt,inp);
  if(p.inCar){p.x=c.x;p.y=c.y;}
  var o=p.inCar?c:p;
  if(Math.abs(o.x)>FOG+15){hurt(14*dt,'被黑雾吞噬');G.fogWarn-=dt;if(G.fogWarn<=0){G.fogWarn=4;banner('黑雾会吞噬生命，快回去！','warn',2.2);}}
  if(Math.abs(o.x)>WALL){o.x=Math.sign(o.x)*WALL;}
  if(o.y>200)o.y=200;
  // 进入地点
  var L=locAt(o.x,o.y);
  if(L&&!L.entered){L.entered=true;banner('发现：'+L.name,'mile',2.5);
    if(G.day===1&&L.tpl==='gas'&&!G.flags.searchHint){G.flags.searchHint=1;hint(isTouch?'按住「互动」搜索货架、冰箱和柜台。\n三轮车进不去，要下车走进去。':'按住 E 搜索货架、冰箱和柜台。\n三轮车进不去，要下车走进去。',7);}
    if(L.tpl==='nest')banner('蛇巢……地上全是蛇蜕','warn',2.5);}
  G.inside=L;
  // 时间
  var D=G.D;G.clock=360+G.t*(900/D.dayLen);
  if(G.clock>=17*60&&!G.warned.dusk){G.warned.dusk=1;banner('黄昏了。天黑前赶到安全区！','warn',3);pushChat('柠檬精','天快黑了，大家别离车太远');}
  if(G.clock>=20*60&&!G.warned.h20){G.warned.h20=1;banner('还有一小时天黑！','warn',3);}
  if(G.clock>=21*60&&!G.horde.active){G.horde.active=true;G.horde.y=o.y+700;G.horde.sp=70;banner('天黑了——后方的食肉怪物潮来了！','warn',3.5);pushChat('系统','夜晚降临。请尽快进入安全区。',1);shake(8);}
  if(G.horde.active){G.darkT+=dt;G.horde.sp=Math.min(330,70+G.darkT*6);G.horde.y-=G.horde.sp*dt;if(G.horde.y-o.y>900)G.horde.y=o.y+900;
    var gap=(G.horde.y-o.y)/M;if(gap<20&&Math.random()<dt*3)shake(2+(20-gap)*.15);if(G.horde.y<=o.y+8)die('天黑后被食肉怪物潮吞没');}
  // 饥饿
  p.hunger=Math.max(0,p.hunger-dt*100/700);
  if(p.hunger<=0){hurt(1.2*dt,'饿死在公路上');if(!G.warned.starve||G.t-G.warned.starve>12){G.warned.starve=G.t;banner('饿得发昏，生命在流失！打开背包吃点东西','warn',2.8);}}
  else if(p.hunger<25&&!G.warned.hungry){G.warned.hungry=1;banner('肚子饿了，打开背包吃点东西','warn',2.5);}
  // 到达安全区
  if(o.y<G.gateY-30){arrive();return;}
  updateSnakes(dt);updateNpcs(dt);updateEvents(dt);
  updateParts(dt);
  // 镜头
  G.cam.z+=((p.inCar?1:1.3)-G.cam.z)*(1-Math.exp(-dt*3));
  VW=W/(ZOOM*G.cam.z);VH=H/(ZOOM*G.cam.z);
  var la=p.inCar?clamp(c.vy*.42,-VH*.3,VH*.1):0,lx=p.inCar?clamp(c.vx*.3,-80,80):0;
  var tx=clamp(o.x+lx,-WALL+VW*.4,WALL-VW*.4),ty=o.y-(p.inCar?VH*.12:VH*.04)+la;
  var k=1-Math.exp(-dt*5);G.cam.x+=(tx-G.cam.x)*k;G.cam.y+=(ty-G.cam.y)*k;
  G.cam.shake=Math.max(0,G.cam.shake-dt*30);
  if(G.hintT>0)G.hintT-=dt;
  if(!G.flags.snakeHint){for(var i=0;i<G.snakes.length;i++){var s=G.snakes[i];if(s.st==='chase'&&!s.dead){G.flags.snakeHint=1;hint(isTouch?'变异黑蛇！点「攻击」挥菜刀砍它。':'变异黑蛇！按空格挥菜刀砍它。',4);break;}}}
}
function updateCar(dt,inp){
  var c=G.car,p=G.player,st=LV[c.lvl];
  if(c.lost)return;
  var fx=Math.sin(c.a),fy=-Math.cos(c.a),rx=-fy,ry=fx;
  var vf=c.vx*fx+c.vy*fy,vl=c.vx*rx+c.vy*ry;
  var off=Math.abs(c.x)>ROAD+6,maxS=st.max*(off?0.62:1),thr=0;c.brake=false;
  if(p.inCar&&inp.m>0.12){
    var ta=Math.atan2(inp.x,-inp.y),d=wrap(ta-c.a),tr=st.turn*clamp(Math.abs(vf)/70,.35,1);
    if(Math.abs(d)<2.25){thr=inp.m;c.a+=clamp(d,-tr*dt,tr*dt);}
    else if(vf>25){c.brake=true;}
    else{thr=-0.6*inp.m;var d2=wrap(ta-(c.a+PI));c.a+=clamp(d2,-tr*dt,tr*dt);}
  }
  if(p.fuel<=0&&thr!==0){thr=0;if(!G.warned.nofuel||G.t-G.warned.nofuel>6){G.warned.nofuel=G.t;banner('没油了！下车去搜燃油（背包里的油上车会自动加）','warn',3);}}
  if(thr>0){if(vf<maxS)vf+=st.acc*thr*dt*(vf<0?2.5:1);else vf-=260*dt;}
  else if(thr<0){if(vf>0)vf-=420*dt;else vf=Math.max(vf-150*dt,-95);}
  if(c.brake){vf-=Math.sign(vf)*Math.min(Math.abs(vf),430*dt);}
  vf-=vf*(thr!==0?0.22:0.85)*dt;
  if(vf>maxS*1.02)vf-=(vf-maxS)*2*dt;
  vl*=Math.exp(-(off?3.5:6.5)*dt);
  c.vx=fx*vf+rx*vl;c.vy=fy*vf+ry*vl;c.thr=thr;
  c.x+=c.vx*dt;c.y+=c.vy*dt;c.spd=vf;
  if(thr!==0)p.fuel=Math.max(0,p.fuel-Math.abs(vf)*dt/M*st.rate);
  var hit=collide(c,22,c);
  if(hit>55){shake(Math.min(12,hit/25));for(var k=0;k<Math.min(12,hit/15);k++)part(c.x+fx*20,c.y+fy*20,rnd(-80,80),rnd(-80,80),.4,2,'rgba(255,200,80,',2);}
  if(hit>120&&p.inCar){hurt((hit-120)*.11/st.armor,'撞车身亡');}
  var as=Math.abs(vf);
  if(as>30&&Math.random()<dt*(off?40:14)*as/200){
    var bx=c.x-fx*26,by=c.y-fy*26;part(bx+rx*rnd(-16,16),by+ry*rnd(-16,16),-fx*rnd(10,40)+rnd(-15,15),-fy*rnd(10,40)+rnd(-15,15),off?1.1:.7,off?7:5,off?'rgba(170,130,90,':'rgba(140,120,110,',1);}
  if(p.inCar&&thr>0&&Math.random()<dt*8)part(c.x-fx*30+rx*8,c.y-fy*30+ry*8,-fx*20,-fy*20,.6,3,'rgba(80,80,80,',1);
  if(G.horde.active&&c.y>G.horde.y-10&&!c.lost){c.lost=true;if(!p.inCar){banner('三轮车被怪物潮吞没了……','warn',3);}}
}
function updateSnakes(dt){
  var p=G.player,c=G.car,o=pos();
  for(var i=G.snakes.length-1;i>=0;i--){var s=G.snakes[i];
    if(s.dead){s.dead-=dt;if(s.dead<=0)G.snakes.splice(i,1);continue;}
    if(Math.abs(s.hy-o.y)>900&&s.st==='idle')continue;
    s.t+=dt;s.cd=Math.max(0,s.cd-dt);s.hurt=Math.max(0,s.hurt-dt);
    var dx=o.x-s.hx,dy=o.y-s.hy,d=Math.sqrt(dx*dx+dy*dy)||1,sz=s.sz;
    if(s.boss){var inNest=G.inside===s.loc;
      if(s.st==='idle'){if(inNest&&d<320){s.st='chase';banner('变异蛇王苏醒了！','warn',3);shake(10);G.flags.snakeHint=1;hint('蛇王扑咬前会停顿一下，躲开再砍。\n血少了它会召唤小蛇。',5);}}
      else if(!inNest){s.st='idle';}
      if(s.st==='chase'&&s.hp<s.max*.7){s.summonT-=dt;if(s.summonT<=0){s.summonT=11;for(var q=0;q<2;q++){var mn=spawnSnake(s.hx+rnd(-60,60),s.hy+rnd(-60,60),1);mn.st='chase';mn.minion=true;}banner('蛇王召唤了小蛇！','warn',2);}}}
    else if(s.st==='idle'){if(d<150)s.st='chase';s.a+=Math.sin(s.t*2+s.ph)*dt;}
    else if(d>460)s.st='idle';
    if(s.st==='chase'){
      var ta=Math.atan2(dx,-dy);
      var spd=s.lunge>0?(s.boss?340:270):(s.cd>0?40:(s.boss?95:100));
      var lr=s.boss?140:70;
      if(s.lunge>0)s.lunge-=dt;else if(d<lr&&s.cd<=0){s.lunge=s.boss?.38:.28;s.cd=s.boss?1.5:1.1;s.a=ta;}
      if(s.lunge<=0)s.a+=clamp(wrap(ta-s.a),-(s.boss?2.5:4)*dt,(s.boss?2.5:4)*dt);
      var wig=Math.sin(s.t*12/sz)*.6;
      s.hx+=Math.sin(s.a+wig*.5)*spd*dt;s.hy+=-Math.cos(s.a+wig*.5)*spd*dt;
      var br=(p.inCar?30:18)+(sz-1)*12;
      if(d<br&&s.lunge>0){s.lunge=0;
        if(p.inCar){if(Math.abs(c.spd)<70)hurt(s.boss?14:6,s.boss?'被变异蛇王咬死':'被变异黑蛇咬死');}
        else hurt(s.boss?20:11,s.boss?'被变异蛇王咬死':'被变异黑蛇咬死');
        for(var k=0;k<5;k++)part(o.x,o.y,rnd(-60,60),rnd(-60,60),.5,3,'rgba(200,30,30,',3);}
    }
    var hb={x:s.hx,y:s.hy};collide(hb,6*sz,null);s.hx=hb.x;s.hy=hb.y;
    if(!s.boss&&!c.lost&&Math.abs(c.spd)>LV[c.lvl].ram&&dist(c.x,c.y,s.hx,s.hy)<32){s.hp=0;killSnake(s);shake(7);c.vx*=.88;c.vy*=.88;continue;}
    var tr=s.trail,last=tr[0];
    if(dist(last.x,last.y,s.hx,s.hy)>4*sz){tr.unshift({x:s.hx,y:s.hy});tr.pop();}
  }
}
function updateNpcs(dt){

    var block=false;for(var j=0;j<G.wrecks.length;j++){var w=G.wrecks[j];if(w.y<n.y&&n.y-w.y<220&&Math.abs(w.x-n.x)<w.w/2+n.w/2+8){block=true;break;}}
    if(block){n.tx=n.x>0?-70:70;}
    n.x+=clamp(n.tx-n.x,-70*dt,70*dt);n.y-=n.sp*dt;n.wob+=dt;
    if(Math.random()<dt*10)part(n.x+rnd(-10,10),n.y+n.h/2,rnd(-10,10),rnd(10,30),.7,5,'rgba(140,120,110,',1);
    var c=G.car,pl=G.player,hx=n.w/2,hy=n.h/2;
    var tgt=[];if(!c.lost)tgt.push([c,22,true]);if(!pl.inCar)tgt.push([pl,9,false]);
    for(var q=0;q<tgt.length;q++){var e=tgt[q][0],rad=tgt[q][1];
      var cx=clamp(e.x,n.x-hx,n.x+hx),cy=clamp(e.y,n.y-hy,n.y+hy),ddx=e.x-cx,ddy=e.y-cy,d=Math.sqrt(ddx*ddx+ddy*ddy);
      if(d>=rad)continue;var nx,ny,pen;if(d===0){nx=e.x<n.x?-1:1;ny=0;pen=rad+hx-Math.abs(e.x-n.x);}else{nx=ddx/d;ny=ddy/d;pen=rad-d;}
      e.x+=nx*pen;e.y+=ny*pen;
      if(tgt[q][2]){var vn=c.vx*nx+(c.vy+n.sp)*ny;if(vn<0){c.vx-=nx*vn*1.4;c.vy-=ny*vn*1.4;
        if(-vn>100&&pl.inCar){hurt(Math.min(14,-vn*.05/LV[c.lvl].armor),'撞车身亡');shake(9);
          if(!n.yelled){n.yelled=1;pushChat(n.name,n.kind==='rv'?'找死啊！敢撞我的房车！':'哎哟我的车！你看着点！');}}}}
      else if(n.sp>80&&pl.hurtT<=0){hurt(18,'被车撞死');e.x+=(e.x<n.x?-1:1)*26;}
    }
    if(n.y<G.gateY-100||n.y>o.y+2500)G.npcs.splice(i,1);
  }
}

function drawTrike(c,occupied){

    ctx.fillStyle='#f2c14e';ctx.fillRect(-18,12,36,3);}
  // 前保险杠

  ctx.fillStyle='#2a1d17';rr(-8,-12,16,11,3);ctx.fill();

function drawCarBody(type,w,h,col,o){

  ctx.fillStyle=col;rr(-hw,-hh,w,h,type==='sedan'?10:6);ctx.fill();

  ctx.fillStyle='rgba(0,0,0,.18)';rr(hw-w*.3,-hh+2,w*.3-2,h-4,6);ctx.fill();

    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-hw+5,-hh+h*.12);ctx.lineTo(hw-5,-hh+h*.12);ctx.stroke();
  }else if(type==='rv'){
    ctx.fillStyle=glass;ctx.fillRect(-hw+5,-hh+6,w-10,12);
    ctx.fillStyle='#d8cfbb';rr(-hw+4,-hh+24,w-8,h-30,4);ctx.fill();
    ctx.fillStyle='#9a8f7a';rr(-10,-hh+50,20,16,2);ctx.fill();ctx.fillStyle='#777';for(var k=0;k<4;k++)ctx.fillRect(-8,-hh+52+k*3.5,16,1.4);
    ctx.fillStyle='#b5651d';ctx.fillRect(-hw,-hh+30,4,h-40);ctx.fillRect(hw-4,-hh+30,4,h-40);
    ctx.fillStyle='rgba(60,80,95,.8)';ctx.fillRect(-hw+8,hh-30,14,10);

    ctx.fillStyle=glass;ctx.fillRect(-hw+5,-hh+4,w-10,9);
  }else if(type==='bus'){
    ctx.fillStyle=glass;ctx.fillRect(-hw+4,-hh+4,w-8,10);
    ctx.fillStyle='rgba(0,0,0,.2)';for(var b=0;b<5;b++)rr(-hw+8,-hh+24+b*28,w-16,20,3),ctx.fill();
  }
  // 灯
  ctx.fillStyle=o.dead?'#6a6450':'#fff0c0';ctx.fillRect(-hw+3,-hh,7,3);ctx.fillRect(hw-10,-hh,7,3);
  ctx.fillStyle=o.dead?'#4a1d1a':'#c4231b';ctx.fillRect(-hw+3,hh-3,7,3);ctx.fillRect(hw-10,hh-3,7,3);

function drawWreck(o){
  ctx.save();ctx.translate(o.x+8,o.y+10);ctx.fillStyle='rgba(0,0,0,.35)';rr(-o.w/2,-o.h/2,o.w,o.h,8);ctx.fill();ctx.restore();

  if(o.rot)ctx.rotate(o.flip?PI/2:-PI/2);else if(o.flip)ctx.rotate(PI);

  drawCarBody(o.type,bw,bh,o.col,{seed:o.parked?0:o.seed,broken:!o.parked,burnt:o.burnt,dead:!o.parked});
  ctx.restore();
}
function drawNpc(n){

function drawSnake(s){

  ctx.save();ctx.globalAlpha=alpha;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=9*sz;ctx.beginPath();ctx.moveTo(tr[0].x+5,tr[0].y+6);for(var i=1;i<n;i++)ctx.lineTo(tr[i].x+5,tr[i].y+6);ctx.stroke();
  var c1=s.boss?'#1c1426':'#16121c',c2=s.boss?'#3a1d3f':'#221a2b';
  for(i=n-1;i>0;i--){var w=(2+9*(1-i/n))*sz;ctx.strokeStyle=s.hurt>0?'#fff':(i%2?c1:c2);ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(tr[i].x,tr[i].y);ctx.lineTo(tr[i-1].x,tr[i-1].y);ctx.stroke();}
  ctx.strokeStyle=s.boss?'rgba(220,60,90,.5)':'rgba(150,90,200,.45)';ctx.lineWidth=1.2*sz;ctx.beginPath();ctx.moveTo(tr[0].x,tr[0].y);for(i=1;i<n-3;i++)ctx.lineTo(tr[i].x-1.5*sz,tr[i].y-1.5*sz);ctx.stroke();
  if(s.boss){ctx.fillStyle='rgba(230,200,120,.55)';for(i=2;i<n-2;i+=2){circ(tr[i].x,tr[i].y,2.2*sz*(1-i/n)+1);ctx.fill();}}

  ctx.translate(hx,hy);ctx.rotate(s.a);ctx.scale(sz,sz);
  ctx.fillStyle=s.hurt>0?'#fff':(s.boss?'#2a1830':'#1a1420');ell(0,-2,7,9);ctx.fill();

  if(!s.dead){ctx.fillStyle=s.boss?'#ffcc22':'#ff3b2a';circ(-3.5,-5,1.8);ctx.fill();circ(3.5,-5,1.8);ctx.fill();

  ctx.restore();

function drawDecal(d){
  switch(d.k){
  case 'crack':ctx.strokeStyle='rgba(15,10,10,.55)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(d.pts[0],d.pts[1]);for(var i=2;i<d.pts.length;i+=2)ctx.lineTo(d.pts[i],d.pts[i+1]);ctx.stroke();break;

    ctx.fillStyle='rgba(255,220,140,.15)';circ(d.x-d.s*.3,d.y-d.s*.3,d.s*.35);ctx.fill();break;
  case 'bone':ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.a);ctx.fillStyle='#d9cfbf';ctx.fillRect(-7,-1.2,14,2.4);circ(-7,-1.5,1.8);ctx.fill();circ(-7,1.5,1.8);ctx.fill();circ(7,-1.5,1.8);ctx.fill();circ(7,1.5,1.8);ctx.fill();
    ctx.fillStyle='#cfc4b2';circ(14,6,4.5);ctx.fill();ctx.fillStyle='#222';circ(12.5,5,1);ctx.fill();circ(15.5,5,1);ctx.fill();ctx.restore();break;
  case 'sign':ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(d.x+4,d.y+2,4,14);ctx.fillStyle='#555';ctx.fillRect(d.x-1.5,d.y-4,3,16);
    ctx.fillStyle='#2f5a3a';rr(d.x-30,d.y-22,60,20,3);ctx.fill();ctx.strokeStyle='#ddd';ctx.lineWidth=1.2;rr(d.x-28,d.y-20,56,16,2);ctx.stroke();
    ctx.fillStyle='#f0f0e6';ctx.font='bold 10px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.txt,d.x,d.y-12);break;
  }
}

  if($('bUse'))tap($('bUse'),function(){var id=G.inv[BAGSEL].id;eat(id);if(!G.inv[BAGSEL]||G.inv[BAGSEL].id!==id)BAGSEL=-1;renderBag();});
  if($('bDrop1'))tap($('bDrop1'),function(){var s=G.inv[BAGSEL];s.n--;if(s.n<=0){G.inv.splice(BAGSEL,1);BAGSEL=-1;}renderBag();});
  if($('bDropAll'))tap($('bDropAll'),function(){G.inv.splice(BAGSEL,1);BAGSEL=-1;renderBag();});
  tap($('bClose'),closeBag);
}
function showNote(title,txt){G.paused=true;G.search=null;ACT_HELD=false;$('notePanel').innerHTML='<h3>'+title+'</h3><p>'+txt+'</p><div class="row2"><div class="b2" id="bNote">收好</div></div>';show('noteOv',true);
  tap($('bNote'),function(){show('noteOv',false);G.paused=false;});}
// 夜晚
function fuelTotal(){return Math.floor(G.player.fuel)+invCount('fuel');}
function spendFuel(n){var a=invRemove('fuel',n);G.player.fuel=Math.max(0,G.player.fuel-(n-a));}
function foodCount(){return invCount('bun')+invCount('rice')+invCount('water')+invCount('pot');}
function removeFood(n){var order=['water','bun','rice','pot'];for(var i=0;i<order.length&&n>0;i++)n-=invRemove(order[i],n);}
var EVENTS={
 1:[{who:'矮胖老板',text:'火堆边，矮胖老板搓着手凑过来：「@独孤求败 大哥，我油箱见底了，明天准得被怪物吃了……我这儿有铁块，跟你换点油行不行？」',
   ch:[{t:'「换你三份燃油可以吗？拿 5 个铁块来。」',sub:'-15 燃油 · +5 铁块',req:function(){return fuelTotal()>=15;},eff:function(){spendFuel(15);var l=invAdd('iron',5);G.flags.bossTrade=1;return '老板咬着牙把铁块塞过来：「成交！大哥仗义！」'+(l?'（背包满了，有 '+l+' 个铁块没放下）':'');}},
       {t:'「没有。」',sub:'什么也不给',eff:function(){G.flags.bossRefuse=1;return '老板脸一沉，嘟囔着走开了：「小气鬼……你等着。」';}}]}],
 2:[{who:'保安',text:'保安拎着棍子堵在你的三轮车前，身后跟着两个人：「这破车今晚归我睡。不服？」',
   pre:function(){return G.flags.bossRefuse?'矮胖老板躲在他身后冷笑。':'';},
   ch:[{t:'「菜刀已经在手里了。」',sub:'生命 -10 · 以后没人敢惹你',eff:function(){G.player.hp=Math.max(1,G.player.hp-10);G.flags.guardFight=1;return '你没等他说完就动了手。棍子落地，保安捂着手腕退回去：「行，你狠。」频道里再也没人提你的三轮车。';}},
       {t:'给他两份吃的打发走',sub:'-2 份食物',req:function(){return foodCount()>=2;},eff:function(){removeFood(2);return '保安掂了掂手里的吃的，哼了一声走了。';}}]},
   {who:'一百万先生',text:'频道里又跳出那条消息：「等出去了我给一百万，谁现在把油让给我。」这一次，他就坐在你对面的火堆旁，眼巴巴地看着你的油箱。',
   ch:[{t:'「先把一百万打过来。」',sub:'不给',eff:function(){return '他张了张嘴，什么也没说出来。';}},
       {t:'分他一份燃油',sub:'-5 燃油',req:function(){return fuelTotal()>=5;},eff:function(){spendFuel(5);G.flags.millionaire=1;var l=invAdd('med',1);return '他愣了半天，从怀里摸出一个急救包塞给你：「我说话算话……先给你利息。」'+(l?'（背包满了，没放下）':'');}}]}]
};
var NIGHT={day:0,ev:0,res:[],traded:{}};
function arrive(){
  G.state='night';G.search=null;setPlayUI(false);pourFuel();
  if(G.day===3){showEnd();return;}
  NIGHT={day:G.day,ev:0,res:[],traded:{}};
  pushChat('系统','生存者 独孤求败 已进入安全区。',1);
  renderNight();show('nightOv',true);
}
function renderNight(){
  var p=G.player,c=G.car,evs=EVENTS[G.day]||[],h='<h3>第 '+G.day+' 天 · 夜 · 安全区</h3>';
  h+='<p style="opacity:.85">'+(G.day===1?'E66 安全区里点着几堆篝火。早上还一起站在公路上的人，少了一半。':'今晚的安全区更安静了。黑雾里，怪物潮的嘶吼一夜没停。')+'</p>';
  h+='<div class="stat"><span>生命 <b>'+Math.ceil(p.hp)+'</b></span><span>饱食 <b>'+Math.ceil(p.hunger)+'</b></span><span>燃油 <b>'+Math.ceil(p.fuel)+'/'+LV[c.lvl].tank+'</b>'+(invCount('fuel')?'（包里 '+invCount('fuel')+'）':'')+'</span><span>铁块 <b>'+invCount('iron')+'</b></span><span>背包 <b>'+G.inv.length+'/'+G.cap+'</b></span></div>';
  // 吃饭
  h+='<div class="sec"><b class="t">吃饭（睡一觉饱食 -15）</b><div class="row2">';var any=false;
  ['bun','rice','pot','water','med'].forEach(function(id){var n=invCount(id);if(n){any=true;var it=ITEMS[id];h+='<div class="b2" data-eat="'+id+'">'+it.name+' ×'+n+'<small>'+itemDesc(id)+'</small></div>';}});
  if(!any)h+='<p>背包里没有吃的。</p>';h+='</div></div>';
  // 升级
  h+='<div class="sec"><b class="t">三轮车</b><p>当前：Lv'+c.lvl+' '+LV[c.lvl].name+'</p>';
  if(c.lvl<3)h+='<div class="row2"><div class="b2 green'+(canUpgrade()?'':' dis')+'" id="bUpN">升级为 Lv'+(c.lvl+1)+' '+LV[c.lvl+1].name+'<small>需要 '+UPCOST[c.lvl]+' 铁块（现有 '+invCount('iron')+'）· 更快、更省油、更耐撞</small></div></div>';
  else h+='<p>已经满级。</p>';h+='</div>';
  // 交易
  var tr=[{k:'a',t:'2 铁块 → 10 燃油',ok:invCount('iron')>=2,f:function(){invRemove('iron',2);G.player.fuel=Math.min(LV[c.lvl].tank,G.player.fuel+10);}},
          {k:'b',t:'12 燃油 → 1 份自热米饭',ok:fuelTotal()>=12&&(G.inv.length<G.cap||invCount('rice')%5),f:function(){spendFuel(12);invAdd('rice',1);}},
          {k:'c',t:'1 急救包 → 3 铁块',ok:invCount('med')>=1,f:function(){invRemove('med',1);invAdd('iron',3);}}];
  h+='<div class="sec"><b class="t">交易 · 眼镜男的小摊</b><div class="row2">';
  tr.forEach(function(x){h+='<div class="b2'+(x.ok?'':' dis')+'" data-tr="'+x.k+'">'+x.t+'</div>';});h+='</div></div>';
  // 剧情
  for(var i=0;i<evs.length;i++){var e=evs[i];if(i>NIGHT.ev)break;
    h+='<div class="sec"><b class="t">'+e.who+'</b><p>'+e.text+(e.pre&&e.pre()?' '+e.pre():'')+'</p>';
    if(NIGHT.res[i])h+='<p class="evres">'+NIGHT.res[i]+'</p>';
    else{h+='<div class="row2">';e.ch.forEach(function(chc,ci){var ok=!chc.req||chc.req();h+='<div class="b2'+(ok?'':' dis')+'" data-ev="'+ci+'">'+chc.t+'<small>'+chc.sub+(ok?'':'（不够）')+'</small></div>';});h+='</div>';}
    h+='</div>';}
  var allDone=NIGHT.ev>=evs.length;
  h+='<div class="row2" style="margin-top:14px"><div class="b2 green'+(allDone?'':' dis')+'" id="bSleep">睡觉 → 第 '+(G.day+1)+' 天'+(allDone?'':'<small>先处理上面的事</small>')+'</div></div>';
  $('nightPanel').innerHTML=h;
  [].forEach.call($('nightPanel').querySelectorAll('[data-eat]'),function(el){tap(el,function(){eat(el.getAttribute('data-eat'));renderNight();});});
  if($('bUpN'))tap($('bUpN'),function(){if(upgrade()){renderNight();}});
  [].forEach.call($('nightPanel').querySelectorAll('[data-tr]'),function(el){tap(el,function(){var k=el.getAttribute('data-tr');tr.forEach(function(x){if(x.k===k&&x.ok)x.f();});renderNight();});});
  [].forEach.call($('nightPanel').querySelectorAll('[data-ev]'),function(el){tap(el,function(){var e=evs[NIGHT.ev],chc=e.ch[+el.getAttribute('data-ev')];if(chc.req&&!chc.req())return;NIGHT.res[NIGHT.ev]=chc.eff();NIGHT.ev++;renderNight();});});
  tap($('bSleep'),function(){if(NIGHT.ev<evs.length)return;sleepNight();});
}
function sleepNight(){
  var p=G.player;p.hunger=Math.max(0,p.hunger-15);if(p.hunger<=0)p.hp=Math.max(5,p.hp-15);else p.hp=Math.min(100,p.hp+20);
  var sv=snapshot(G.day+1);writeSave(sv);show('nightOv',false);startDay(sv);showMap();
}
function showEnd(){
  var p=G.player,h='<h3>第一章 完</h3>';
  h+='<p>蛇王的尸体还在冒着黑烟。安全区的铁门在身后合上。</p><p>频道里，E66 分区的排行榜刷新了——第一名：<b style="color:#ffd27a">独孤求败</b>。</p><p>有人问他到底要去哪。</p><p>李峥只回了一句：「走到公路尽头。」</p>';
  h+='<div class="sec"><b class="t">三天的成绩</b><div class="stat"><span>击杀 <b>'+G.kills+'</b></span><span>搜刮 <b>'+G.searchedTotal+'</b> 处</span><span>三轮车 <b>Lv'+G.car.lvl+'</b></span><span>剩余生命 <b>'+Math.ceil(p.hp)+'</b></span></div></div>';
  h+='<p style="opacity:.7;font-size:13px">第二章（合区、副本、时空珠的秘密）还在路上。</p>';
  h+='<div class="row2"><div class="b2 green" id="bReplay">重新开始第一章</div></div>';
  BEST={cleared:true,kills:G.kills,searched:G.searchedTotal};try{localStorage.setItem('gonglu_v3_best',JSON.stringify(BEST));}catch(e){}
  var fs=freshSave();fs.fresh=true;writeSave(fs);
  $('endPanel').innerHTML=h;show('endOv',true);
  tap($('bReplay'),function(){var sv=freshSave();writeSave(sv);hideAllOv();startDay(sv);showMap();});
}
function showDead(){
  if(G.state==='dead')return;G.state='dead';setPlayUI(false);
  $('deadPanel').innerHTML='<h3 style="color:#ff6b5a;font-size:30px">你死了</h3><p>'+(G.reason||'你死在了公路上')+'</p><p style="opacity:.8">第 '+G.day+' 天 · '+fmtClock(G.clock)+'</p><p style="font-size:13px;opacity:.7">游戏中的死亡，就是真正的死亡——不过这一次，你还能回到今天早上。</p><div class="row2"><div class="b2 green" id="bRetry">从第 '+G.day+' 天早上重来</div></div>';
  show('deadOv',true);
  tap($('bRetry'),function(){show('deadOv',false);startDay(SAVE&&SAVE.day===G.day?SAVE:snapshot(G.day));showMap();});
}
function tap(el,fn){el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();fn(e);});}
// 按钮
tap(bCar,function(){bCar.classList.add('on');toggleCar();});
tap(bAct,function(){bAct.classList.add('on');ACT_HELD=true;interactPress();});
tap($('bAtk'),function(){$('bAtk').classList.add('on');ATK_HELD=true;attack();});
tap(bBag,function(){openBag();});
['bCar','bAct','bAtk'].forEach(function(id){var el=$(id);['pointerup','pointercancel','pointerleave'].forEach(function(ev){el.addEventListener(ev,function(){el.classList.remove('on');if(id==='bAtk')ATK_HELD=false;if(id==='bAct')ACT_HELD=false;});});});
// 摇杆
var joyBase=$('joyBase'),joyKnob=$('joyKnob');
function joyHome(){var bx=86,by=H-112-SAFE_B;joyBase.style.left=bx+'px';joyBase.style.top=by+'px';joyKnob.style.transform='translate(0,0)';joyBase.style.opacity='.55';}
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse')return;
  if(!isTouch){isTouch=true;document.body.classList.add('touch');document.body.classList.remove('desk');if(G&&G.state==='play')show('ctl',true);}
  if(!G||G.state!=='play'||JOY.id!==null)return;
  if(e.clientX>W*.6||e.clientY<H*.3)return;
  e.preventDefault();JOY.id=e.pointerId;JOY.bx=e.clientX;JOY.by=e.clientY;JOY.x=JOY.y=JOY.m=0;
  joyBase.style.left=JOY.bx+'px';joyBase.style.top=JOY.by+'px';joyBase.style.opacity='1';
  try{cv.setPointerCapture(e.pointerId);}catch(er){}
},{passive:false});
function joyMove(e){if(e.pointerId!==JOY.id)return;e.preventDefault();var dx=e.clientX-JOY.bx,dy=e.clientY-JOY.by,l=Math.sqrt(dx*dx+dy*dy),R=50;
  if(l>R){dx=dx/l*R;dy=dy/l*R;l=R;}JOY.x=dx/R;JOY.y=dy/R;JOY.m=l/R;joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';}
function joyEnd(e){if(e.pointerId!==JOY.id)return;JOY.id=null;JOY.x=JOY.y=JOY.m=0;joyHome();}
window.addEventListener('pointermove',joyMove,{passive:false});
window.addEventListener('pointerup',joyEnd);window.addEventListener('pointercancel',joyEnd);
// 键盘
window.addEventListener('keydown',function(e){
  var k=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].indexOf(k)>=0)e.preventDefault();
  if(KEYS[k])return;KEYS[k]=true;
  if(!G)return;
  if(k==='Escape'){if(!$('bagOv').classList.contains('hidden'))closeBag();}
  if(G.state==='play'){
    if(k==='KeyB'||k==='KeyI'||k==='Tab'){if($('bagOv').classList.contains('hidden'))openBag();else closeBag();return;}
    if(G.paused)return;
    if(k==='KeyE'||k==='Enter')interactPress();if(k==='Space')attack();if(k==='KeyF')toggleCar();
    if(DEBUG){if(k==='KeyG'){G.god=!G.god;banner('无敌：'+(G.god?'开':'关'),'sys',1.5);}if(k==='KeyN')dbg.toGate();if(k==='KeyK')dbg.killBoss();if(k==='KeyT')G.t+=G.D.dayLen/15*2;if(k==='KeyJ')dbg.toBoss();}
  }
});
window.addEventListener('keyup',function(e){KEYS[e.code]=false;});
window.addEventListener('blur',function(){KEYS={};ATK_HELD=false;ACT_HELD=false;});
['touchstart','touchmove','touchend'].forEach(function(ev){document.addEventListener(ev,function(e){var t=e.target;if(t.tagName==='A')return;if(ev==='touchmove'&&t.closest&&t.closest('.panel,.board'))return;if(t.closest&&t.closest('.panel,.board')&&ev!=='touchmove')return;e.preventDefault();},{passive:false});});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('resize',function(){resize();joyHome();});
document.body.classList.add(isTouch?'touch':'desk');
// 调试（只在 ?debug 时可用）
var dbg={
  toGate:function(){var c=G.car;c.lost=false;c.x=0;c.y=G.gateY+260;c.a=0;c.vx=c.vy=0;G.player.inCar=true;G.player.x=c.x;G.player.y=c.y;G.cam.x=0;G.cam.y=c.y;},
  killBoss:function(){if(G.boss)killSnake(G.boss);},
  toBoss:function(){var L=locByTpl('nest');if(!L)return;G.player.inCar=false;G.player.x=L.ex+(L.side<0?-20:20);G.player.y=L.ey;G.cam.x=G.player.x;G.cam.y=G.player.y;},
  toLoc:function(t){var L=locByTpl(t);if(!L)return;G.player.inCar=false;G.player.x=L.ex+(L.side<0?-20:20);G.player.y=L.ey;G.cam.x=G.player.x;G.cam.y=G.player.y;var c=G.car;c.x=L.side>0?ROAD-30:-ROAD+30;c.y=L.ey;c.vx=c.vy=0;}
};
// ---------- 主循环 ----------
buildAssets();resize();titleScene();joyHome();renderTitle();
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  try{update(dt);render();updateUI(dt);}catch(err){console.error(err&&err.stack||err);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__G=function(){return G;};
window.__api={interactPress:interactPress,toggleCar:toggleCar,attack:attack,openBag:openBag,closeBag:closeBag,eat:eat,nearCont:function(){return nearCont();},objectives:function(){return objectives().map(function(o){return o.txt+(o.done?' ✓':'');});}};
if(DEBUG)window.__dbg=dbg;
})();
